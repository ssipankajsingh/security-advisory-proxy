services:
  - type: web
    name: security-advisory-proxy
    runtime: docker            # Dockerfile pins Python 3.11 — native runtime ignored .python-version
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:                   # sync:false = value set in Render dashboard, never stored in git
      - key: ACCESS_CODE
        sync: false
      - key: VIEWER_ACCESS_CODE
        sync: false
      - key: ADMIN_PIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: NVD_API_KEY
        sync: false
      - key: VULNCHECK_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: DIGEST_EMAIL
        sync: false
      - key: TEAMS_WEBHOOK
        sync: false
